<svg fill="none" viewBox="0 0 850 180" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .snake-card {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 10px;
          padding: 16px 20px;
          font-family: 'JetBrains Mono', monospace;
          color: #c9d1d9;
          box-sizing: border-box;
          height: 165px;
          position: relative;
          overflow: hidden;
        }
        .snake-title {
          font-size: 12px;
          color: #58a6ff;
          font-weight: 600;
          margin-bottom: 12px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(42, 1fr);
          grid-template-rows: repeat(5, 14px);
          gap: 4px;
        }
        .cell {
          width: 14px;
          height: 14px;
          border-radius: 2px;
          background: #161b22;
        }
        .c-1 { background: #0e4429; }
        .c-2 { background: #006d32; }
        .c-3 { background: #26a641; }
        .c-4 { background: #39d353; }
        
        .snake-head {
          width: 14px;
          height: 14px;
          border-radius: 3px;
          background: #58a6ff;
          box-shadow: 0 0 8px #58a6ff;
          animation: snake-move 6s infinite linear;
          position: absolute;
        }
        @keyframes snake-move {
          0% { left: 40px; top: 52px; }
          25% { left: 350px; top: 52px; }
          35% { left: 350px; top: 90px; }
          60% { left: 680px; top: 90px; }
          75% { left: 680px; top: 125px; }
          90% { left: 120px; top: 125px; }
          100% { left: 40px; top: 52px; }
        }
      </style>
      <div class="snake-card">
        <div class="snake-title">
          <span>🐍 CONTINUOUS CONTRIBUTION STREAM &amp; ACTIVITY</span>
          <span style="color: #7ee787; font-size: 11px;">● LIVE AUTONOMOUS TRACKING</span>
        </div>
        <div class="grid">
          <!-- Row 1 -->
          <div class="cell"></div><div class="cell c-1"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div>
          <!-- Row 2 -->
          <div class="cell c-1"></div><div class="cell c-2"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div>
          <!-- Row 3 -->
          <div class="cell"></div><div class="cell c-4"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div>
          <!-- Row 4 -->
          <div class="cell c-2"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div><div class="cell c-4"></div><div class="cell"></div><div class="cell c-3"></div><div class="cell"></div><div class="cell c-2"></div><div class="cell"></div><div class="cell c-1"></div><div class="cell"></div>
