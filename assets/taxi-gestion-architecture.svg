<svg fill="none" viewBox="0 0 850 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .blueprint-card {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 10px;
          padding: 16px 20px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          color: #c9d1d9;
          box-sizing: border-box;
          height: 305px;
        }
        .bp-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid #21262d;
          padding-bottom: 8px;
          margin-bottom: 14px;
        }
        .bp-title {
          font-weight: 700;
          color: #58a6ff;
          font-size: 14px;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .bp-badge {
          background: #238636;
          color: white;
          font-size: 10px;
          font-weight: 700;
          padding: 2px 8px;
          border-radius: 12px;
          text-transform: uppercase;
        }
        .grid-container {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          margin-top: 10px;
        }
        .layer-box {
          background: #161b22;
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 12px;
          position: relative;
        }
        .layer-box:hover {
          border-color: #58a6ff;
        }
        .layer-num {
          font-family: monospace;
          font-size: 10px;
          color: #8b949e;
          text-transform: uppercase;
          margin-bottom: 4px;
        }
        .layer-title {
          font-weight: 600;
          font-size: 13px;
          color: #f0f6fc;
          margin-bottom: 8px;
        }
        .layer-desc {
          font-size: 11px;
          color: #8b949e;
          line-height: 1.45;
        }
        .tech-tag {
          display: inline-block;
          background: rgba(56, 139, 253, 0.15);
          color: #58a6ff;
          border: 1px solid rgba(56, 139, 253, 0.3);
          border-radius: 4px;
          font-size: 10px;
          padding: 2px 6px;
          margin-top: 8px;
          font-family: monospace;
        }
        .flow-arrows {
          display: flex;
          justify-content: space-around;
          margin: 10px 0 4px 0;
          color: #388bfd;
          font-size: 14px;
          font-family: monospace;
        }
      </style>
      <div class="blueprint-card">
        <div class="bp-header">
          <div class="bp-title">
            <span>🚕 TAXI GESTIÓN — OFFLINE-FIRST SYSTEM ARCHITECTURE</span>
          </div>
          <div class="bp-badge">Google Play Production</div>
        </div>
        
        <div class="grid-container">
          <div class="layer-box">
            <div class="layer-num">01 / Presentation</div>
            <div class="layer-title">Jetpack Compose UI</div>
            <div class="layer-desc">Declarative interface with strict unidirectional data flow (UDF). Fast, modern and responsive.</div>
            <span class="tech-tag">StateFlow &amp; Coroutines</span>
          </div>

          <div class="layer-box">
            <div class="layer-num">02 / Domain &amp; State</div>
            <div class="layer-title">Clean Use Cases</div>
            <div class="layer-desc">Isolated financial calculators, offline metrics and driver shifts business rules.</div>
            <span class="tech-tag">Domain Logic</span>
          </div>

          <div class="layer-box">
            <div class="layer-num">03 / Persistence</div>
            <div class="layer-title">Offline Engine &amp; DB</div>
            <div class="layer-desc">Zero latency local storage with encrypted database records and audit log integrity.</div>
            <span class="tech-tag">Room / SQLite</span>
          </div>

          <div class="layer-box">
            <div class="layer-num">04 / OS &amp; Security</div>
            <div class="layer-title">Android System &amp; Play</div>
            <div class="layer-desc">Scoped storage enforcement, granular runtime permissions and release automation.</div>
            <span class="tech-tag">Play Console API</span>
          </div>
        </div>

        <div class="flow-arrows">
          <span>[ UI Rendering ] ⇄ [ State Stream ] ⇄ [ Local Sync Engine ] ⇄ [ OS Runtime &amp; Kernel ]</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
